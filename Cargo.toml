[workspace]
resolver = "2"
members = [
    "core_shared",
    "core_resources",
    "core_net",
    "host_server",
    "host_client",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["bevy_game contributors"]
publish = false

# Sjednocené verze klíčových knihoven napříč crates.
# Konkrétní crates si vybírají, které z nich opravdu konzumují
# (workspace.dependencies se neresolvují, dokud je nějaký člen nepoužije).
[workspace.dependencies]
# --- Engine ---
bevy = { version = "0.18", default-features = false }

# --- Networking (lightyear: prediction, rollback, replication) ---
# 0.26 ladí s Bevy 0.18. Pro Phase 2 stačí `messaging` (channels) —
# `replication` zapneme v Phase 3 spolu s ECS bridge.
lightyear = { version = "0.26", default-features = false, features = [
    "std",
    "client",
    "server",
    "netcode",
    "udp",
    # Phase 3 — replication, prediction, interpolation pro síťované entity.
    "replication",
    "prediction",
    "interpolation",
] }

# --- Scripting (mlua + bevy_mod_scripting bridge) ---
# Použito v Phase 1+; mlua-feature flagy se nastavují v cílovém crate.
mlua = { version = "0.10", default-features = false, features = ["lua54", "vendored"] }
bevy_mod_scripting = { version = "0.13", default-features = false }

# --- Database (sqlx: PostgreSQL prod / SQLite dev) ---
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio-rustls",
    "postgres",
    "sqlite",
    "macros",
    "migrate",
] }

# --- Async runtime pro DB / IO mimo ECS loop ---
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }

# --- Serialization ---
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
# Server-side config (server.toml).
toml = { version = "0.9", default-features = false, features = ["std", "parse", "display", "serde"] }

# --- Filesystem (VFS scanner + watcher) ---
walkdir = "2"
notify = "6"
crossbeam-channel = "0.5"

# --- Hash pro file digest (Phase 2 file sync) ---
blake3 = "1"

# --- Platform-specific user dirs (config / cache / saves) ---
# Windows: %APPDATA% / %LOCALAPPDATA%
# Linux:   $XDG_CONFIG_HOME (~/.config) / $XDG_CACHE_HOME (~/.cache)
# macOS:   ~/Library/Application Support / ~/Library/Caches
dirs = "5"

# --- HTTP server pro asset/script delivery (Phase 2) ---
axum = { version = "0.7", default-features = false, features = ["tokio", "http1"] }
tower = { version = "0.5", default-features = false }
tower-http = { version = "0.5", default-features = false, features = ["fs"] }

# --- HTTP klient na klientské straně (file download během handshake) ---
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "blocking",
] }

# --- Error handling ---
thiserror = "2"
anyhow = "1"

# --- Lokální crates (workspace members) ---
core_shared = { path = "core_shared" }
core_resources = { path = "core_resources" }
core_net = { path = "core_net" }

# Bevy doporučuje optimalizovat dependencies i v dev profilu pro
# rozumný framerate, zatímco vlastní crates kompilujeme rychle.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
