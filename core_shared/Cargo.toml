[package]
name = "core_shared"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
# Headless-safe podmnožina Bevy — žádné rendering / windowing features.
# Klient a server si v sobě bevy nakonfigurují s vlastními features.
bevy = { workspace = true, default-features = false, features = [
    "std",
    "bevy_state",
    "serialize",
] }
serde = { workspace = true }
