<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  width: 100%; height: 100%;
  background: transparent;
  overflow: hidden;
  font-family: 'Segoe UI', Arial, sans-serif;
  user-select: none;
}

#hud {
  position: fixed;
  bottom: 32px;
  left: 32px;
  display: flex;
  align-items: center;
  gap: 10px;
}

#hp-icon {
  font-size: 20px;
  line-height: 1;
  filter: drop-shadow(0 1px 3px rgba(0,0,0,0.8));
}

#hp-bar-wrap {
  width: 200px;
  height: 14px;
  background: rgba(0, 0, 0, 0.55);
  border-radius: 7px;
  overflow: hidden;
  box-shadow: 0 0 0 1px rgba(255,255,255,0.12);
}

#hp-bar {
  height: 100%;
  width: 100%;
  border-radius: 7px;
  background: #3de86b;
  transition: width 0.3s ease, background 0.4s ease;
}

#hp-text {
  min-width: 42px;
  text-align: right;
  font-size: 13px;
  font-weight: 700;
  color: #fff;
  text-shadow: 0 1px 4px rgba(0,0,0,0.9);
  letter-spacing: 0.5px;
}
</style>
</head>
<body>
<!-- DIAGNOSTIKA: jasně viditelný blok, pokud NUI renderuje -->
<div style="position:fixed;top:0;left:0;background:red;color:yellow;font-size:32px;font-weight:bold;padding:16px;z-index:9999;border:4px solid lime;">
  NUI FUNGUJE
</div>
<div id="hud">
  <span id="hp-icon">♥</span>
  <div id="hp-bar-wrap">
    <div id="hp-bar"></div>
  </div>
  <span id="hp-text">100</span>
</div>

<script>
'use strict';

var currentHp = 100;
var maxHp = 100;

function updateBar(hp, max) {
  var pct = max > 0 ? Math.max(0, Math.min(1, hp / max)) : 0;

  document.getElementById('hp-bar').style.width = (pct * 100) + '%';
  document.getElementById('hp-text').textContent = Math.round(hp);

  var color;
  if (pct > 0.6)       color = '#3de86b';  // zelená
  else if (pct > 0.3)  color = '#f0c040';  // žlutá
  else                 color = '#e84040';  // červená

  document.getElementById('hp-bar').style.background = color;
}

window.addEventListener('message', function(event) {
  var data = event.data;
  if (!data || data.type !== 'hp_update') return;

  currentHp = typeof data.hp  === 'number' ? data.hp  : currentHp;
  maxHp     = typeof data.max === 'number' ? data.max : maxHp;
  updateBar(currentHp, maxHp);
});

// Výchozí stav při načtení
updateBar(100, 100);
</script>
</body>
</html>
