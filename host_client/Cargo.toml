[package]
name = "host_client"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[features]
default = []
# `cargo run -p host_client --features dynamic_linking`
dynamic_linking = ["bevy/dynamic_linking"]

[dependencies]
# Klient potřebuje plný grafický stack — winit, render, pbr, ui, atd.
# Workspace bevy má `default-features = false`, takže si je tu zapínáme
# explicitně. V Bevy 0.18 byly některé features přejmenovány / sloučeny
# (`zstd` a `webgl2` zmizely jako samostatné flagy).
bevy_framepace = "0.21"
bevy = { workspace = true, default-features = false, features = [
    "std",
    "bevy_asset",
    "bevy_audio",
    "bevy_color",
    "bevy_core_pipeline",
    "bevy_gilrs",
    "bevy_gizmos",
    "bevy_gizmos_render",   # Bevy 0.18: render pipeline pro gizmos (oddělen od API)
    "bevy_gltf",
    "bevy_log",
    "bevy_mesh",            # Bevy 0.18: mesh API (oddělen od render)
    "bevy_pbr",
    "bevy_post_process",    # Bevy 0.18: post-process pass (tonemapping, bloom, …)
    "bevy_render",
    "bevy_scene",
    "bevy_sprite",
    "bevy_sprite_render",   # Bevy 0.18: sprite render pipeline (oddělen od API!)
    "bevy_state",
    "bevy_text",
    "bevy_ui",
    "bevy_ui_render",       # Bevy 0.18: UI render pipeline (oddělen od API)
    "bevy_window",
    "bevy_winit",
    "default_font",
    "hdr",
    "ktx2",
    "multi_threaded",
    "jpeg",
    "dds",
    "png",
    "serialize",
    "tonemapping_luts",
    "vorbis",
    "x11",
    # KTX2 dekompresor — Bevy 0.18 vyžaduje výběr backendu (Rust nebo C).
    # Volíme pure Rust, ať build neřetězí systémové libzstd.
    "zstd_rust",
] }
bevy_gltf = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde_json = { workspace = true }
core_shared = { workspace = true }
core_resources = { workspace = true }
core_net = { workspace = true }
lightyear = { workspace = true }

# Klientský config (`client.toml` v %APPDATA%).
serde = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
dirs = { workspace = true }

[[bin]]
name = "host_client"
path = "src/main.rs"
