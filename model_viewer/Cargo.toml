[package]
name = "model_viewer"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[features]
default = []
dynamic_linking = ["bevy/dynamic_linking"]

[dependencies]
bevy = { workspace = true, default-features = false, features = [
    "std",
    "bevy_asset",
    "bevy_color",
    "bevy_core_pipeline",
    "bevy_gizmos",
    "bevy_gizmos_render",
    "bevy_gltf",
    "bevy_log",
    "bevy_mesh",
    "bevy_pbr",
    "bevy_post_process",
    "bevy_render",
    "bevy_scene",
    "bevy_text",
    "bevy_ui",
    "bevy_ui_render",
    "bevy_window",
    "bevy_winit",
    "default_font",
    "hdr",
    "ktx2",
    "multi_threaded",
    "jpeg",
    "dds",
    "png",
    "tonemapping_luts",
    "zstd_rust",
] }
bevy_gltf = { workspace = true }
core_resources = { workspace = true }
core_drawable = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
rfd = "0.14"

[[bin]]
name = "model_viewer"
path = "src/main.rs"
